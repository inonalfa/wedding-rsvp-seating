name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: node scripts/deploy-hosted.mjs --dry-run
      - name: Prepare isolated fictional demo
        run: |
          npm run demo:setup
          npx wrangler d1 migrations apply site-creator-d1 --local
      - name: Select Chromium for Playwright
        run: |
          if chrome=$(command -v google-chrome); then
            printf 'PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=%s\n' "$chrome" >> "$GITHUB_ENV"
          else
            timeout 90s npx playwright install chromium --only-shell
          fi
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: demo-e2e
          path: test-results/
          retention-days: 7
